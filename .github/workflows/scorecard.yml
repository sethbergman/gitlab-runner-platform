name: scorecard

# OpenSSF Scorecard rates the repository's supply-chain practices: pinned
# dependencies, workflow token permissions, branch rules, SAST, fuzzing and
# more. Each check scoring below 10 shows in the Security tab as an alert
# with the details. It reads the default branch as GitHub serves it, so it
# runs on main and weekly, not on pull requests. Results stay in this
# repository; they are not published to the OpenSSF API.

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write # upload the results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
          category: scorecard
