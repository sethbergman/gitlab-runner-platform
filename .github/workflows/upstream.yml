name: upstream

# Dependabot cannot see the tools CI installs from GitHub releases (pinned
# under .github/versions/) or the gitlab-runner chart the tenants pin. Once a
# week this compares each with its latest release and opens, or refreshes, one
# pull request per pin that is behind. See .github/scripts/upstream.sh.
#
# Those pull requests come from github-actions[bot], and GitHub holds every
# workflow run on them until a maintainer approves it ("Approve workflows to
# run" on the pull request); until then the required checks have not run and
# the pull request cannot merge. A GitHub App's token would avoid the approval
# step, at the cost of an App to create and a private key to keep.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bumps:
    name: Tool pins and gitlab-runner chart
    runs-on: ubuntu-latest
    permissions:
      contents: write      # push a branch per bump
      pull-requests: write # open or refresh its pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: .github/scripts/upstream.sh
        env:
          GH_TOKEN: ${{ github.token }}
