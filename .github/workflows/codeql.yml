name: codeql

# CodeQL static analysis of the Go autoscaler and of these workflows, with the
# security-extended queries. Results go to the repository's Security tab; a
# pull request shows the alerts it introduces.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the results
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.language == 'go'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: autoscaler/go.mod
          cache: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      # Only the autoscaler is analysed; the module under .github/tools holds
      # CI's pinned Go tools and no code of its own. CodeQL traces a command
      # that starts with `go build`, so this one runs from the module's
      # directory rather than through `go -C`.
      - if: matrix.language == 'go'
        working-directory: autoscaler
        run: go build ./...
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
