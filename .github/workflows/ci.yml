name: ci

# Every action is pinned to a commit; the comment after it names the release,
# which Dependabot reads and keeps current together with the commit.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROMETHEUS_VERSION: v2.54.1

jobs:
  go:
    name: Go (vet, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: autoscaler/go.mod
          # No third-party modules, so there is no go.sum to key a cache on.
          cache: false
      - name: gofmt, go vet, race-checked tests, coverage floor
        run: make test
      - name: build
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/warmpool-autoscaler" ./cmd/warmpool-autoscaler
        working-directory: autoscaler
      - name: Binary serves valid metrics (dry run, static queue)
        run: |
          "$RUNNER_TEMP/warmpool-autoscaler" --dry-run --source=static --interval=1s --listen=127.0.0.1:18080 &
          pid=$!
          sleep 3
          curl -fsS http://127.0.0.1:18080/healthz
          curl -fsS http://127.0.0.1:18080/readyz
          curl -fsS http://127.0.0.1:18080/metrics | tee "$RUNNER_TEMP/metrics.txt"
          kill "${pid}"
          docker run --rm -i --entrypoint promtool "prom/prometheus:${PROMETHEUS_VERSION}" check metrics < "$RUNNER_TEMP/metrics.txt"

  govulncheck:
    name: Go (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: autoscaler/go.mod
          cache: false
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck -C autoscaler ./...

  terraform:
    name: Terraform (fmt, validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.9"
      - run: terraform fmt -check -recursive terraform
      - name: validate
        run: |
          for dir in terraform/modules/runner-fleet terraform/examples/eks; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
      - name: committed tenant values match what Terraform renders (mocked providers)
        run: terraform -chdir=terraform/examples/eks test

  manifests:
    name: Manifests, rules, dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: kubeconform (deploy/ via Kustomize, and the Argo CD objects under gitops/)
        run: make manifests
      - name: each tenant's values render with its pinned chart
        run: make tenants
      - name: promtool
        run: |
          docker run --rm -v "$PWD/observability:/rules:ro" --entrypoint promtool \
            "prom/prometheus:${PROMETHEUS_VERSION}" check rules /rules/prometheus-rules.yaml
      - name: dashboard is valid JSON
        run: jq empty observability/grafana/runner-platform.json

  gitops-e2e:
    name: GitOps on kind (Argo CD)
    runs-on: ubuntu-latest
    needs: [manifests]
    env:
      ARGOCD_VERSION: v3.5.0
      # Point Argo CD at the commit under test, in whichever repo it lives.
      REPO_URL: ${{ github.event.pull_request.head.repo.clone_url || format('{0}/{1}.git', github.server_url, github.repository) }}
      REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: gitops-e2e
      - name: Install Argo CD
        run: |
          kubectl create namespace argocd
          kubectl apply -n argocd --server-side --force-conflicts \
            -f "https://raw.githubusercontent.com/argoproj/argo-cd/${ARGOCD_VERSION}/manifests/install.yaml"
          kubectl -n argocd rollout status deploy/argocd-repo-server --timeout=300s
          kubectl -n argocd rollout status statefulset/argocd-application-controller --timeout=300s
          kubectl -n argocd rollout status deploy/argocd-applicationset-controller --timeout=300s
      - name: Point every Argo CD object at this commit
        run: |
          mkdir -p "$RUNNER_TEMP/gitops/bootstrap" "$RUNNER_TEMP/gitops/platform"
          for f in gitops/bootstrap/*.yaml gitops/platform/*.yaml; do
            sed -e "s#https://github.com/sethbergman/gitlab-runner-platform.git#${REPO_URL}#g" \
                -e "s#targetRevision: main#targetRevision: ${REVISION}#g" \
                -e "s#revision: main#revision: ${REVISION}#g" \
                "$f" > "$RUNNER_TEMP/$f"
          done
          grep -rn -E 'repoURL:|[rR]evision:' "$RUNNER_TEMP/gitops"
      - name: Root app renders gitops/platform
        run: |
          # The app-of-apps as documented, minus its automated sync: the
          # objects it manages are applied in the next step pointed at this
          # commit, and a self-healing root would reset them to what Git says.
          yq 'del(.spec.syncPolicy)' "$RUNNER_TEMP/gitops/bootstrap/root.yaml" | kubectl apply -f -
          for i in $(seq 1 60); do
            kubectl -n argocd get application/platform-root -o jsonpath='{.status.resources[*].kind}' | grep -q . && break
            sleep 5
          done
          conditions=$(kubectl -n argocd get application/platform-root -o jsonpath='{.status.conditions[*].type}')
          test -z "${conditions}" || { echo "root app conditions: ${conditions}"; exit 1; }
          kubectl -n argocd get application/platform-root \
            -o jsonpath='{range .status.resources[*]}{.kind}/{.name}{"\n"}{end}' | sort > "$RUNNER_TEMP/root-resources"
          printf '%s\n' AppProject/ci-system AppProject/ci-tenants \
            Application/warmpool-autoscaler ApplicationSet/runner-tenants | sort | diff - "$RUNNER_TEMP/root-resources"
      - name: Apply the projects, the autoscaler app and the tenant ApplicationSet
        run: kubectl apply -f "$RUNNER_TEMP/gitops/platform"
      - name: App syncs cleanly
        run: |
          kubectl -n argocd wait application/warmpool-autoscaler \
            --for=jsonpath='{.status.sync.status}'=Synced --timeout=300s
          kubectl -n gitlab-runner-system get deploy,role,rolebinding,networkpolicy
      - name: ApplicationSet creates one synced runner release per tenant
        run: |
          # What Terraform provides on a real cluster, outside Argo CD's reach:
          # the tenant namespace and its runner token.
          for dir in gitops/tenants/*/; do
            tenant=$(basename "${dir}")
            kubectl create namespace "ci-${tenant}"
            # Both keys: the chart mounts them as non-optional items.
            kubectl -n "ci-${tenant}" create secret generic gitlab-runner-token \
              --from-literal=runner-token=glrt-e2e-placeholder --from-literal=runner-registration-token=
          done
          for dir in gitops/tenants/*/; do
            tenant=$(basename "${dir}")
            for i in $(seq 1 36); do
              kubectl -n argocd get "application/runner-${tenant}" >/dev/null 2>&1 && break
              sleep 5
            done
            kubectl -n argocd wait "application/runner-${tenant}" \
              --for=jsonpath='{.status.sync.status}'=Synced --timeout=300s
            test "$(kubectl -n argocd get "application/runner-${tenant}" -o jsonpath='{.spec.project}')" = ci-tenants
            test "$(kubectl -n argocd get "application/runner-${tenant}" -o jsonpath='{.spec.destination.namespace}')" = "ci-${tenant}"
            kubectl -n "ci-${tenant}" get deploy,serviceaccount,configmap,service
          done
          # Exactly the folders under gitops/tenants, nothing else.
          kubectl -n argocd get applications -l platform.ci/tenant \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | sort > "$RUNNER_TEMP/tenant-apps"
          ls gitops/tenants | sed 's#^#runner-#' | sort | diff - "$RUNNER_TEMP/tenant-apps"
      - name: Project ci-tenants refuses guardrail objects and foreign namespaces
        run: |
          # Two apps a tenant must not get away with: one ships a ResourceQuota,
          # LimitRange and NetworkPolicy into its own namespace, the other
          # targets a namespace outside ci-*.
          tenant_app() {
            kubectl apply -f - <<EOF
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: $1
            namespace: argocd
          spec:
            project: ci-tenants
            source:
              repoURL: ${REPO_URL}
              targetRevision: ${REVISION}
              path: .github/e2e/tenant-escape
            destination:
              server: https://kubernetes.default.svc
              namespace: $2
            syncPolicy:
              automated: {}
          EOF
          }
          tenant_app tenant-escape ci-payments
          tenant_app tenant-foreign gitlab-runner-system
          # Wait until Argo CD has judged both, then show its verdicts.
          verdict() { kubectl -n argocd get "application/$1" -o jsonpath='{.status}'; }
          for i in $(seq 1 36); do
            verdict tenant-escape | grep -q 'not permitted in project ci-tenants' \
              && verdict tenant-foreign | grep -q -i 'destination' && break
            sleep 5
          done
          for app in tenant-escape tenant-foreign; do
            echo "== ${app}"
            kubectl -n argocd get "application/${app}" \
              -o jsonpath='sync={.status.sync.status}{"\n"}{range .status.conditions[*]}{.type}: {.message}{"\n"}{end}{.status.operationState.message}{"\n"}'
            test "$(kubectl -n argocd get "application/${app}" -o jsonpath='{.status.sync.status}')" != Synced
          done
          verdict tenant-escape | grep -q 'not permitted in project ci-tenants'
          verdict tenant-foreign | grep -q -i 'destination'
          for ns in ci-payments gitlab-runner-system; do
            for kind in resourcequota limitrange networkpolicy; do
              if kubectl -n "${ns}" get "${kind}" tenant-escape 2>/dev/null; then
                echo "${kind}/tenant-escape reached ${ns}"; exit 1
              fi
            done
          done
          kubectl -n argocd delete application tenant-escape tenant-foreign
      - name: Autoscaler-owned replicas are not treated as drift
        run: |
          # Act like the autoscaler, then force Argo CD to compare against Git.
          kubectl -n gitlab-runner-system scale deploy/runner-warm-pool --replicas=3
          kubectl -n argocd annotate application/warmpool-autoscaler \
            argocd.argoproj.io/refresh=hard --overwrite
          sleep 60
          sync=$(kubectl -n argocd get application/warmpool-autoscaler -o jsonpath='{.status.sync.status}')
          replicas=$(kubectl -n gitlab-runner-system get deploy/runner-warm-pool -o jsonpath='{.spec.replicas}')
          echo "sync=${sync} replicas=${replicas}"
          test "${sync}" = Synced
          test "${replicas}" = 3
      - name: Drift in a field Git owns is reverted
        run: |
          # Git sets terminationGracePeriodSeconds: 0; change it by hand.
          kubectl -n gitlab-runner-system patch deploy/runner-warm-pool --type=json \
            -p '[{"op":"replace","path":"/spec/template/spec/terminationGracePeriodSeconds","value":30}]'
          for i in $(seq 1 36); do
            v=$(kubectl -n gitlab-runner-system get deploy/runner-warm-pool -o jsonpath='{.spec.template.spec.terminationGracePeriodSeconds}')
            [ "${v}" = 0 ] && { echo "self-heal reverted the change after ~$((i*5))s"; exit 0; }
            sleep 5
          done
          echo "self-heal did not revert drift"; exit 1
      - name: Argo CD state on failure
        if: failure()
        run: |
          kubectl -n argocd get applications,applicationsets
          kubectl -n argocd get applications -o yaml

  checkov:
    name: Checkov (IaC security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bridgecrewio/checkov-action@3f0caf0c3aa9f56ade6b49f6e60b63aaeafb75a3 # v12.3141.0
        with:
          directory: .
          framework: terraform,kubernetes,dockerfile,github_actions
          quiet: true

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: [go]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Derive the tag from the event: "main" on a push, "v1.2.3" on a tag,
      # "pr-12" on a pull request. github.ref_name is "12/merge" on a pull
      # request, which is not a valid image tag and failed every PR build.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/warmpool-autoscaler
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: autoscaler
          build-args: VERSION=${{ steps.meta.outputs.version }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
