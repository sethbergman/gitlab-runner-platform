name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (vet, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autoscaler
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: autoscaler/go.mod
          # No third-party modules, so there is no go.sum to key a cache on.
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1
      - run: CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/warmpool-autoscaler

  terraform:
    name: Terraform (fmt, validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.9"
      - run: terraform fmt -check -recursive terraform
      - name: validate
        run: |
          for dir in terraform/modules/runner-fleet terraform/examples/eks; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  manifests:
    name: Manifests, rules, dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: false
      - run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
      - name: kubeconform
        run: kubectl kustomize deploy/autoscaler | "$(go env GOPATH)/bin/kubeconform" -strict -summary -
      - name: promtool
        run: |
          docker run --rm -v "$PWD/observability:/rules:ro" --entrypoint promtool \
            prom/prometheus:v2.54.1 check rules /rules/prometheus-rules.yaml
      - name: dashboard is valid JSON
        run: jq empty observability/grafana/runner-platform.json

  gitops-e2e:
    name: GitOps on kind (Argo CD)
    runs-on: ubuntu-latest
    needs: [manifests]
    env:
      ARGOCD_VERSION: v3.5.0
      # Point Argo CD at the commit under test, in whichever repo it lives.
      REPO_URL: ${{ github.event.pull_request.head.repo.clone_url || format('{0}/{1}.git', github.server_url, github.repository) }}
      REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: helm/kind-action@v1
        with:
          cluster_name: gitops-e2e
      - name: Install Argo CD
        run: |
          kubectl create namespace argocd
          kubectl apply -n argocd --server-side --force-conflicts \
            -f "https://raw.githubusercontent.com/argoproj/argo-cd/${ARGOCD_VERSION}/manifests/install.yaml"
          kubectl -n argocd rollout status deploy/argocd-repo-server --timeout=300s
          kubectl -n argocd rollout status statefulset/argocd-application-controller --timeout=300s
      - name: Apply projects and the autoscaler app at this commit
        run: |
          retarget() {
            sed -e "s#https://github.com/sethbergman/gitlab-runner-platform.git#${REPO_URL}#g" \
                -e "s#targetRevision: main#targetRevision: ${REVISION}#g" "$1"
          }
          retarget gitops/platform/appproject.yaml | kubectl apply -f -
          retarget gitops/platform/warmpool-autoscaler.yaml | kubectl apply -f -
      - name: App syncs cleanly
        run: |
          kubectl -n argocd wait application/warmpool-autoscaler \
            --for=jsonpath='{.status.sync.status}'=Synced --timeout=300s
          kubectl -n gitlab-runner-system get deploy,role,rolebinding,networkpolicy
      - name: Autoscaler-owned replicas are not treated as drift
        run: |
          # Act like the autoscaler, then force Argo CD to compare against Git.
          kubectl -n gitlab-runner-system scale deploy/runner-warm-pool --replicas=3
          kubectl -n argocd annotate application/warmpool-autoscaler \
            argocd.argoproj.io/refresh=hard --overwrite
          sleep 60
          sync=$(kubectl -n argocd get application/warmpool-autoscaler -o jsonpath='{.status.sync.status}')
          replicas=$(kubectl -n gitlab-runner-system get deploy/runner-warm-pool -o jsonpath='{.spec.replicas}')
          echo "sync=${sync} replicas=${replicas}"
          test "${sync}" = Synced
          test "${replicas}" = 3
      - name: Drift in a field Git owns is reverted
        run: |
          # Git sets terminationGracePeriodSeconds: 0; change it by hand.
          kubectl -n gitlab-runner-system patch deploy/runner-warm-pool --type=json \
            -p '[{"op":"replace","path":"/spec/template/spec/terminationGracePeriodSeconds","value":30}]'
          for i in $(seq 1 36); do
            v=$(kubectl -n gitlab-runner-system get deploy/runner-warm-pool -o jsonpath='{.spec.template.spec.terminationGracePeriodSeconds}')
            [ "${v}" = 0 ] && { echo "self-heal reverted the change after ~$((i*5))s"; exit 0; }
            sleep 5
          done
          echo "self-heal did not revert drift"; exit 1
      - name: Argo CD state on failure
        if: failure()
        run: kubectl -n argocd get application warmpool-autoscaler -o yaml

  checkov:
    name: Checkov (IaC security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform,kubernetes,dockerfile,github_actions
          quiet: true

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: [go]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Derive the tag from the event: "main" on a push, "v1.2.3" on a tag,
      # "pr-12" on a pull request. github.ref_name is "12/merge" on a pull
      # request, which is not a valid image tag and failed every PR build.
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/warmpool-autoscaler
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
      - uses: docker/build-push-action@v7
        with:
          context: autoscaler
          build-args: VERSION=${{ steps.meta.outputs.version }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
