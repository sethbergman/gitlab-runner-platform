name: ci

# Every action is pinned to a commit; the comment after it names the release,
# which Dependabot reads and keeps current together with the commit.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes the run in flight; on main, tags
# and manual runs every commit gets a finished run, queued one after another.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The tools CI installs (actionlint, Argo CD, kubeconform, moto, Prometheus
# for promtool, Terraform) are pinned in files under .github/versions/, not here: upstream.yml
# bumps them weekly, and a workflow token may not edit a workflow.
jobs:
  go:
    name: Go (vet, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: autoscaler/go.mod
          # No third-party modules, so there is no go.sum to key a cache on.
          cache: false
      - name: gofmt, go vet, race-checked tests, coverage floor
        run: make test
      - name: Fuzz the schedule parser and GitLab pagination, 30s each
        run: make fuzz FUZZTIME=30s
      - name: Failing fuzz input, to commit as a regression test
        if: failure()
        run: find autoscaler -path '*/testdata/fuzz/*' -type f -print -exec cat {} \;
      - name: build
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/warmpool-autoscaler" ./cmd/warmpool-autoscaler
        working-directory: autoscaler
      - name: Binary serves valid metrics (dry run, static queue)
        run: |
          "$RUNNER_TEMP/warmpool-autoscaler" --dry-run --source=static --interval=1s --listen=127.0.0.1:18080 &
          pid=$!
          sleep 3
          curl -fsS http://127.0.0.1:18080/healthz
          curl -fsS http://127.0.0.1:18080/readyz
          curl -fsS http://127.0.0.1:18080/metrics | tee "$RUNNER_TEMP/metrics.txt"
          kill "${pid}"
          docker run --rm -i --entrypoint promtool "prom/prometheus:$(cat .github/versions/prometheus)" check metrics < "$RUNNER_TEMP/metrics.txt"
      - name: Rules and dashboard name only metrics the binary exports
        run: |
          exported=$(grep -oE '^warmpool_[a-z_]+' "$RUNNER_TEMP/metrics.txt" | sort -u)
          used=$(grep -ohE 'warmpool_[a-z_]+' observability/prometheus-rules.yaml observability/grafana/runner-platform.json | sort -u)
          missing=$(comm -13 <(echo "$exported") <(echo "$used"))
          if [ -n "$missing" ]; then
            echo "named in observability/ but not exported by the binary:"; echo "$missing"; exit 1
          fi
          echo "$used"

  govulncheck:
    name: Go (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: autoscaler/go.mod
          cache: false
      # govulncheck is pinned, with its dependencies by hash, in the tools
      # module .github/tools, which Dependabot keeps current.
      - run: go -C .github/tools tool govulncheck -C ../../autoscaler ./...

  terraform:
    name: Terraform (fmt, validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: pins
        run: echo "terraform=$(cat .github/versions/terraform)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.pins.outputs.terraform }}
      - run: terraform fmt -check -recursive terraform
      - name: validate
        run: |
          for dir in terraform/modules/runner-fleet terraform/examples/eks terraform/e2e/kind; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
      - name: the module keeps the security posture it documents (mocked providers)
        run: terraform -chdir=terraform/modules/runner-fleet test
      - name: committed tenant values match what Terraform renders (mocked providers)
        run: terraform -chdir=terraform/examples/eks test

  terraform-e2e:
    name: Terraform apply and destroy on kind
    runs-on: ubuntu-latest
    needs: [terraform]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: terraform-e2e
      # Terraform runs in a container at the pinned version, so there is no
      # setup-terraform step.
      - name: Apply, re-plan and destroy the module (Kubernetes on kind, AWS on moto)
        run: .github/scripts/terraform-e2e.sh

  manifests:
    name: Manifests, rules, dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: autoscaler/go.mod
          cache: false
      - name: actionlint on every workflow, with shellcheck on each run step
        run: |
          docker run --rm -v "${PWD}:/repo:ro" -w /repo \
            "rhysd/actionlint:$(cat .github/versions/actionlint)" -color
      - run: go install github.com/yannh/kubeconform/cmd/kubeconform@"$(cat .github/versions/kubeconform)"
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: kubeconform (deploy/ via Kustomize, and the Argo CD objects under gitops/)
        run: make manifests
      - name: each tenant's values render with its pinned chart
        run: make tenants
      - name: promtool checks the rules and runs their unit tests
        run: |
          docker run --rm -v "$PWD/observability:/rules:ro" --entrypoint promtool \
            "prom/prometheus:$(cat .github/versions/prometheus)" check rules /rules/prometheus-rules.yaml
          docker run --rm -v "$PWD/observability:/rules:ro" --entrypoint promtool \
            "prom/prometheus:$(cat .github/versions/prometheus)" test rules /rules/prometheus-rules.test.yaml
      - name: dashboard is valid JSON
        run: jq empty observability/grafana/runner-platform.json

  gitops-e2e:
    name: GitOps on kind (Argo CD)
    runs-on: ubuntu-latest
    needs: [manifests]
    env:
      # Point Argo CD at the commit under test, in whichever repo it lives.
      REPO_URL: ${{ github.event.pull_request.head.repo.clone_url || format('{0}/{1}.git', github.server_url, github.repository) }}
      REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: gitops-e2e
      - name: Install Argo CD
        run: |
          ARGOCD_VERSION=$(cat .github/versions/argocd)
          echo "Argo CD ${ARGOCD_VERSION}"
          kubectl create namespace argocd
          kubectl apply -n argocd --server-side --force-conflicts \
            -f "https://raw.githubusercontent.com/argoproj/argo-cd/${ARGOCD_VERSION}/manifests/install.yaml"
          # Redis too: the repo-server caches every manifest it generates there.
          kubectl -n argocd rollout status deploy/argocd-redis --timeout=300s
          kubectl -n argocd rollout status deploy/argocd-repo-server --timeout=300s
          kubectl -n argocd rollout status statefulset/argocd-application-controller --timeout=300s
          kubectl -n argocd rollout status deploy/argocd-applicationset-controller --timeout=300s
      - name: Point every Argo CD object at this commit
        run: |
          mkdir -p "$RUNNER_TEMP/gitops/bootstrap" "$RUNNER_TEMP/gitops/platform"
          for f in gitops/bootstrap/*.yaml gitops/platform/*.yaml; do
            sed -e "s#https://github.com/sethbergman/gitlab-runner-platform.git#${REPO_URL}#g" \
                -e "s#targetRevision: main#targetRevision: ${REVISION}#g" \
                -e "s#revision: main#revision: ${REVISION}#g" \
                "$f" > "$RUNNER_TEMP/$f"
          done
          grep -rn -E 'repoURL:|[rR]evision:' "$RUNNER_TEMP/gitops"
      - name: Root app renders gitops/platform
        run: |
          # The app-of-apps as documented, minus its automated sync: the
          # objects it manages are applied in the next step pointed at this
          # commit, and a self-healing root would reset them to what Git says.
          yq 'del(.spec.syncPolicy)' "$RUNNER_TEMP/gitops/bootstrap/root.yaml" | kubectl apply -f -
          # A first manifest request that fails (once, on main, it timed out a
          # second after the app was created) is retried only on Argo CD's own
          # schedule, minutes away. Ask for a fresh one every 30s instead.
          for i in $(seq 1 60); do
            kubectl -n argocd get application/platform-root -o jsonpath='{.status.resources[*].kind}' | grep -q . && break
            if [ $((i % 6)) = 0 ] && kubectl -n argocd get application/platform-root \
                -o jsonpath='{.status.conditions[*].type}' | grep -q ComparisonError; then
              echo "ComparisonError after ~$((i * 5))s; requesting a hard refresh"
              kubectl -n argocd annotate application/platform-root argocd.argoproj.io/refresh=hard --overwrite
            fi
            sleep 5
          done
          conditions=$(kubectl -n argocd get application/platform-root -o jsonpath='{.status.conditions[*].type}')
          test -z "${conditions}" || { echo "root app conditions: ${conditions}"; exit 1; }
          kubectl -n argocd get application/platform-root \
            -o jsonpath='{range .status.resources[*]}{.kind}/{.name}{"\n"}{end}' | sort > "$RUNNER_TEMP/root-resources"
          printf '%s\n' AppProject/ci-system AppProject/ci-tenants \
            Application/warmpool-autoscaler ApplicationSet/runner-tenants | sort | diff - "$RUNNER_TEMP/root-resources"
      - name: Apply the projects, the autoscaler app and the tenant ApplicationSet
        run: kubectl apply -f "$RUNNER_TEMP/gitops/platform"
      - name: App syncs cleanly
        run: |
          kubectl -n argocd wait application/warmpool-autoscaler \
            --for=jsonpath='{.status.sync.status}'=Synced --timeout=300s
          kubectl -n gitlab-runner-system get deploy,role,rolebinding,networkpolicy
      - name: The pinned image's build is attested by this repository's CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image=$(grep -oE 'ghcr\.io/[^"]+@sha256:[0-9a-f]{64}' deploy/autoscaler/deployment.yaml)
          echo "pinned ${image}"
          gh attestation verify "oci://${image}" --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/ci.yml"
      - name: The pinned image runs
        run: |
          # Synced only means the objects exist: Argo CD reported it while
          # the deployment pinned a tag that had never been published. The
          # pod waits for the token Secret, which a secret store provides on
          # a real cluster; a placeholder lets it start here. GITLAB_URL does
          # not resolve, so every reconcile fails and the autoscaler holds
          # the pool at its current size, the documented behavior under an
          # outage, and it never touches the warm pool the drift test below
          # resizes by hand.
          kubectl -n gitlab-runner-system create secret generic warmpool-gitlab-token             --from-literal=token=placeholder
          kubectl -n gitlab-runner-system rollout status deploy/warmpool-autoscaler --timeout=180s
          kubectl -n argocd wait application/warmpool-autoscaler             --for=jsonpath='{.status.health.status}'=Healthy --timeout=120s
          for _ in $(seq 30); do
            kubectl -n gitlab-runner-system logs deploy/warmpool-autoscaler > "$RUNNER_TEMP/autoscaler.log"
            grep -q '"msg":"starting"' "$RUNNER_TEMP/autoscaler.log"               && grep -q 'queue read failed; holding current size' "$RUNNER_TEMP/autoscaler.log" && break
            sleep 2
          done
          grep -E '"msg":"(starting|queue read failed; holding current size)"' "$RUNNER_TEMP/autoscaler.log"
      - name: ApplicationSet creates one synced runner release per tenant
        run: |
          # What Terraform provides on a real cluster, outside Argo CD's reach:
          # the tenant namespace and its runner token.
          for dir in gitops/tenants/*/; do
            tenant=$(basename "${dir}")
            kubectl create namespace "ci-${tenant}"
            # Both keys: the chart mounts them as non-optional items.
            kubectl -n "ci-${tenant}" create secret generic gitlab-runner-token \
              --from-literal=runner-token=glrt-e2e-placeholder --from-literal=runner-registration-token=
          done
          for dir in gitops/tenants/*/; do
            tenant=$(basename "${dir}")
            for _ in $(seq 1 36); do
              kubectl -n argocd get "application/runner-${tenant}" >/dev/null 2>&1 && break
              sleep 5
            done
            kubectl -n argocd wait "application/runner-${tenant}" \
              --for=jsonpath='{.status.sync.status}'=Synced --timeout=300s
            test "$(kubectl -n argocd get "application/runner-${tenant}" -o jsonpath='{.spec.project}')" = ci-tenants
            test "$(kubectl -n argocd get "application/runner-${tenant}" -o jsonpath='{.spec.destination.namespace}')" = "ci-${tenant}"
            kubectl -n "ci-${tenant}" get deploy,serviceaccount,configmap,service
          done
          # Exactly the folders under gitops/tenants, nothing else.
          kubectl -n argocd get applications -l platform.ci/tenant \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | sort > "$RUNNER_TEMP/tenant-apps"
          find gitops/tenants -mindepth 1 -maxdepth 1 -type d -printf 'runner-%f\n' | sort | diff - "$RUNNER_TEMP/tenant-apps"
      - name: Project ci-tenants refuses guardrail objects, cluster-scoped objects and foreign namespaces
        run: |
          # Three apps a tenant must not get away with: one ships a
          # ResourceQuota, LimitRange and NetworkPolicy into its own namespace,
          # one ships a Namespace and a ClusterRole, one targets a namespace
          # outside ci-*.
          tenant_app() { # name path namespace
            kubectl apply -f - <<EOF
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: $1
            namespace: argocd
          spec:
            project: ci-tenants
            source:
              repoURL: ${REPO_URL}
              targetRevision: ${REVISION}
              path: $2
            destination:
              server: https://kubernetes.default.svc
              namespace: $3
            syncPolicy:
              automated: {}
          EOF
          }
          tenant_app tenant-escape .github/e2e/tenant-escape ci-payments
          tenant_app tenant-cluster .github/e2e/tenant-cluster-escape ci-payments
          tenant_app tenant-foreign .github/e2e/tenant-escape gitlab-runner-system
          # Wait until Argo CD has judged all three, then show its verdicts.
          verdict() { kubectl -n argocd get "application/$1" -o jsonpath='{.status}'; }
          refused() {
            verdict tenant-escape | grep -q 'not permitted in project ci-tenants' \
              && verdict tenant-cluster | grep -q 'not permitted in project ci-tenants' \
              && verdict tenant-foreign | grep -q -i 'destination'
          }
          for _ in $(seq 1 36); do refused && break; sleep 5; done
          for app in tenant-escape tenant-cluster tenant-foreign; do
            echo "== ${app}"
            kubectl -n argocd get "application/${app}" \
              -o jsonpath='sync={.status.sync.status}{"\n"}{range .status.conditions[*]}{.type}: {.message}{"\n"}{end}{.status.operationState.message}{"\n"}'
            test "$(kubectl -n argocd get "application/${app}" -o jsonpath='{.status.sync.status}')" != Synced
          done
          refused
          for ns in ci-payments gitlab-runner-system; do
            for kind in resourcequota limitrange networkpolicy; do
              if kubectl -n "${ns}" get "${kind}" tenant-escape 2>/dev/null; then
                echo "${kind}/tenant-escape reached ${ns}"; exit 1
              fi
            done
          done
          for ref in namespace/ci-rogue clusterrole/tenant-escape; do
            if kubectl get "${ref}" 2>/dev/null; then echo "${ref} reached the cluster"; exit 1; fi
          done
          kubectl -n argocd delete application tenant-escape tenant-cluster tenant-foreign
      - name: Autoscaler-owned replicas are not treated as drift
        run: |
          # Act like the autoscaler, then force Argo CD to compare against Git.
          kubectl -n gitlab-runner-system scale deploy/runner-warm-pool --replicas=3
          kubectl -n argocd annotate application/warmpool-autoscaler \
            argocd.argoproj.io/refresh=hard --overwrite
          sleep 60
          sync=$(kubectl -n argocd get application/warmpool-autoscaler -o jsonpath='{.status.sync.status}')
          replicas=$(kubectl -n gitlab-runner-system get deploy/runner-warm-pool -o jsonpath='{.spec.replicas}')
          echo "sync=${sync} replicas=${replicas}"
          test "${sync}" = Synced
          test "${replicas}" = 3
      - name: The placeholders run the pinned pause image
        run: |
          # They schedule only on CI nodes; make the kind node one.
          kubectl label node --all workload=ci --overwrite
          kubectl -n gitlab-runner-system rollout status deploy/runner-warm-pool --timeout=180s
          pinned=$(grep -oE 'registry\.k8s\.io/pause:[^@ ]+@sha256:[0-9a-f]{64}' deploy/autoscaler/warm-pool.yaml)
          running=$(kubectl -n gitlab-runner-system get pods -l app.kubernetes.io/name=runner-warm-pool \
            -o jsonpath='{range .items[*]}{.status.containerStatuses[0].imageID}{"\n"}{end}')
          echo "pinned ${pinned}"; echo "${running}"
          test "$(echo "${running}" | wc -l)" = 3
          if echo "${running}" | grep -vqF "@${pinned#*@}"; then
            echo "a placeholder runs an image other than the pinned digest"; exit 1
          fi
      - name: Drift in a field Git owns is reverted
        run: |
          # Git sets terminationGracePeriodSeconds: 0; change it by hand.
          kubectl -n gitlab-runner-system patch deploy/runner-warm-pool --type=json \
            -p '[{"op":"replace","path":"/spec/template/spec/terminationGracePeriodSeconds","value":30}]'
          for i in $(seq 1 36); do
            v=$(kubectl -n gitlab-runner-system get deploy/runner-warm-pool -o jsonpath='{.spec.template.spec.terminationGracePeriodSeconds}')
            [ "${v}" = 0 ] && { echo "self-heal reverted the change after ~$((i*5))s"; exit 0; }
            sleep 5
          done
          echo "self-heal did not revert drift"; exit 1
      - name: Argo CD state on failure
        if: failure()
        run: |
          kubectl -n argocd get applications,applicationsets
          kubectl -n argocd get applications -o yaml
          kubectl -n argocd get pods -o wide
          for w in deploy/argocd-repo-server statefulset/argocd-application-controller deploy/argocd-redis; do
            echo "== ${w}"; kubectl -n argocd logs "${w}" --tail=60 || true
          done

  checkov:
    name: Checkov (IaC security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bridgecrewio/checkov-action@b17b606d6ec72bb8ba5721ad5b7e340b80a9fc39 # v12.3142.0
        with:
          directory: .
          framework: terraform,kubernetes,dockerfile,github_actions
          quiet: true

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: [go]
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Derive the tag from the event: "main" on a push, "v1.2.3" on a tag,
      # "pr-12" on a pull request. github.ref_name is "12/merge" on a pull
      # request, which is not a valid image tag and failed every PR build.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/warmpool-autoscaler
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: autoscaler
          # One tag, both architectures: the Dockerfile cross-compiles, so no
          # QEMU is needed and the CI node group can be x86 or Graviton.
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.meta.outputs.version }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BuildKit attaches an SBOM and a provenance statement to the image
          # index; mode=max records the source commit and the build steps.
          provenance: mode=max
          sbom: true

  # On a v* tag, once every job is green: sign a build-provenance attestation
  # for the pushed image through Sigstore and create the GitHub Release
  # carrying the image digest and the commands that verify it.
  release:
    name: GitHub Release (tags)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, govulncheck, terraform, terraform-e2e, manifests, gitops-e2e, checkov]
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release
      id-token: write     # sign the attestation
      attestations: write # store it on the repository
      packages: write     # and on the image in GHCR
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/warmpool-autoscaler
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.image.outputs.digest }}
          push-to-registry: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.image.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
        run: |
          {
            echo "## Image"
            echo
            echo '```'
            echo "${IMAGE}:${TAG}"
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "linux/amd64 and linux/arm64, with a BuildKit SBOM and provenance on the index and a signed build-provenance attestation. Verify, then pin the digest in deploy/autoscaler/deployment.yaml:"
            echo
            echo '```'
            echo "gh attestation verify oci://${IMAGE}:${TAG} --owner ${OWNER}"
            echo "docker buildx imagetools inspect ${IMAGE}:${TAG} --format '{{ json .SBOM }}'"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          args=()
          case "$TAG" in *-*) args+=(--prerelease) ;; esac
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes \
            --notes-file "$RUNNER_TEMP/notes.md" "${args[@]}"
