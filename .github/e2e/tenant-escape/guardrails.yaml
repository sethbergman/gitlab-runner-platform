# What a tenant must never be able to do through Argo CD: replace the
# guardrails Terraform put in its namespace. The gitops-e2e job points an
# Application in project ci-tenants at this directory and expects Argo CD to
# refuse every object here (namespaceResourceBlacklist in
# gitops/platform/appproject.yaml). Nothing applies this for real.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-escape
spec:
  hard:
    pods: "100000"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-escape
spec:
  limits:
    - type: Container
      max:
        cpu: "64"
        memory: 256Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant-escape
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - {}
  egress:
    - {}
