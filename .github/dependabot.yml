version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: gomod
    directories: ["/autoscaler", "/.github/tools"]
    schedule: { interval: weekly }
  - package-ecosystem: docker
    # The Dockerfile's base images. The warm pool's pause image is bumped by
    # upstream.yml, since Dependabot takes its tags for pre-releases.
    directory: /autoscaler
    schedule: { interval: weekly }
  - package-ecosystem: terraform
    directories: ["/terraform/modules/runner-fleet", "/terraform/examples/eks", "/terraform/e2e/kind"]
    schedule: { interval: weekly }
