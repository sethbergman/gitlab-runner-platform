# GENERATED by `make gitops-values` from the runner-fleet Terraform module.
# Do not edit by hand: change Terraform inputs and regenerate, so the IAM
# role, cache bucket and values can never drift apart.
# (Example values: AWS account 123456789012.)
# Values for the gitlab-runner Helm chart, rendered per tenant by Terraform.
gitlabUrl: https://gitlab.example.com
concurrent: 15
checkInterval: 3
logFormat: json
unregisterRunners: true

rbac:
  create: true

serviceAccount:
  create: true
  name: gitlab-runner
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/ci-runner-platform

# The runner manager itself runs fully locked down.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  privileged: false
  capabilities:
    drop: ["ALL"]
podSecurityContext:
  runAsUser: 100
  fsGroup: 65533
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

podLabels:
  platform.ci/tenant: platform

metrics:
  enabled: true
  portName: metrics
  port: 9252
service:
  enabled: true

runners:
  secret: gitlab-runner-token
  config: |
    [[runners]]
      name = "platform"
      [runners.kubernetes]
        namespace = "ci-platform"
        image = "alpine:3.20"
        privileged = false
        allow_privilege_escalation = false
        cpu_request = "500m"
        cpu_limit = "2"
        memory_request = "1Gi"
        memory_limit = "4Gi"
        helper_cpu_request = "100m"
        helper_memory_request = "128Mi"
        service_cpu_request = "100m"
        service_memory_request = "128Mi"
        poll_timeout = 600
        # Helper image for the runner's own architecture (arm64 on Graviton),
        # not the x86_64 default.
        helper_image_autoset_arch_and_os = true
        [runners.kubernetes.node_selector]
          "workload" = "ci"
        [runners.kubernetes.node_tolerations]
          "dedicated=ci" = "NoSchedule"
        [runners.kubernetes.pod_labels]
          "platform.ci/tenant" = "platform"
      [runners.cache]
        Type = "s3"
        Path = "platform"
        Shared = true
        [runners.cache.s3]
          ServerAddress = "s3.amazonaws.com"
          BucketName = "ci-runner-cache-123456789012-us-east-1"
          BucketLocation = "us-east-1"
          AuthenticationType = "iam"
